aid: gobble
name: Gobble
description: >-
  Gobble is a meal-kit delivery service that ships chef-prepped dinner kits designed
  to be cooked in about fifteen minutes, marketed as "restaurant-level delicious in
  minutes." The company preps and portions seasonal ingredients before shipping them
  in refrigerated boxes to customers' doorsteps, and offers three flexible subscription
  plans - Classic, Lean & Clean (650 calories or less, low carb, lean proteins), and
  Vegetarian - with no long-term commitment. Backed by Andreessen Horowitz (a16z),
  Gobble operates a direct-to-consumer subscription business and does not currently
  publish a public developer program, API, or developer documentation. This profile
  captures its public web presence for the API Evangelist network.
